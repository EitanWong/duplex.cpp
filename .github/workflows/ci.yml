name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  source:
    name: Source and schemas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - run: python scripts/check-repository.py
      - name: Check macOS shell syntax
        shell: bash
        run: |
          for script in scripts/macos/*.sh scripts/macos/*.command; do
            bash -n "$script" || exit
          done
      - name: Check Windows PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem scripts/windows -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - run: python -m pip install pydantic numpy pytest pytest-asyncio
      - run: python -m pytest tests/test_schemas.py -q
        working-directory: runtime
        env:
          PYTHONPATH: .
