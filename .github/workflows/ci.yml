name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  source:
    name: Source and schemas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - run: python scripts/check-repository.py
      - run: python -m pip install pydantic numpy pytest pytest-asyncio
      - run: python -m pytest tests/test_schemas.py -q
        working-directory: runtime
        env:
          PYTHONPATH: .
